services:
  jellyanli:
    command: null
    container_name: jellyanli
    deploy:
      resources:
        reservations:
          memory: 64MB
      placement: {}
    entrypoint: null
    environment:
      PGID: "1000"
      PUID: "1000"
      PORT: "37773"
      TZ: Europe/Moscow
    image: ghcr.io/jellyanli/jellyanli:latest
    labels:
      icon: https://raw.githubusercontent.com/JellyAnLi/JellyAnLi/refs/heads/main/frontend/public/logo-256px.jpg
    network_mode: bridge
    ports:
      - target: 37773
        published: "37773"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/JellyAnLi/config
        target: /config
      - type: bind
        source: /media/FileStorage
        target: /DATA
x-casaos:
  description:
    en_US: Jellyfin Anime Linker - utility for creating symlinks for anime torrent
      downloads to Jellyfin library format.
    ru_RU: Утилита для автоматического создания символических ссылок аниме-торрентов
      под структуру Jellyfin.
  hostname: 192.168.1.123
  icon: https://raw.githubusercontent.com/JellyAnLi/JellyAnLi/refs/heads/main/frontend/public/logo-256px.jpg
  index: /
  is_uncontrolled: false
  main: jellyanli
  port_map: "37773"
  scheme: http
  title:
    custom: JellyAnLi
    en_US: JellyAnLi